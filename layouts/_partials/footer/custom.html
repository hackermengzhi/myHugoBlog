{{- if .Site.Params.musicPlayer.enabled -}}
    {{- $musicTracks := .Site.Params.musicPlayer.tracks -}}
    {{- with hugo.Data.music.tracks -}}
        {{- $musicTracks = . -}}
    {{- end -}}
    <aside class="music-player" data-music-player aria-label="音乐播放器">
        <button class="music-player__collapse" type="button" data-player-collapse aria-label="收起音乐播放器" title="收起播放器">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>

        <div class="music-player__main">
            <img class="music-player__cover" data-player-cover src="" alt="歌曲封面">
            <div class="music-player__body">
                <div class="music-player__meta">
                    <div>
                        <strong data-player-title></strong>
                        <a data-player-artist href="#" target="_blank" rel="noopener noreferrer"></a>
                    </div>
                    <button class="music-player__list-toggle" type="button" data-player-list-toggle aria-label="打开播放列表" title="播放列表">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8"/><path d="m18 15 3 2-3 2z"/></svg>
                    </button>
                </div>

                <div class="music-player__timeline">
                    <span data-player-current>0:00</span>
                    <input data-player-progress type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
                    <span data-player-duration>0:00</span>
                </div>

                <div class="music-player__controls">
                    <button type="button" data-player-prev aria-label="上一首" title="上一首">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg>
                    </button>
                    <button class="music-player__play" type="button" data-player-play aria-label="播放" title="播放">
                        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
                    </button>
                    <button type="button" data-player-next aria-label="下一首" title="下一首">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="music-player__embed" data-player-embed hidden>
            <iframe data-player-iframe title="Bilibili 官方播放器" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <div class="music-player__playlist" data-player-list hidden>
            <div class="music-player__playlist-title">播放列表</div>
            <ol data-player-tracks></ol>
        </div>

        <audio data-player-audio preload="metadata"></audio>
    </aside>

    <button class="music-player-launcher" type="button" data-player-launcher aria-label="打开音乐播放器" title="音乐播放器" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
    </button>

    <script>
        (() => {
            const tracks = [
                {{- range $musicTracks }}
                {
                    title: {{ .title | jsonify | safeJS }},
                    artist: {{ .artist | jsonify | safeJS }},
                    url: {{ default "" .url | jsonify | safeJS }},
                    bvid: {{ default "" .bvid | jsonify | safeJS }},
                    page: {{ default 1 .page }},
                    duration: {{ default 0 .duration }},
                    cover: {{ .cover | relURL | jsonify | safeJS }},
                    licenseUrl: {{ default .sourceUrl .licenseUrl | jsonify | safeJS }}
                },
                {{- end }}
            ];

            const player = document.querySelector('[data-music-player]');
            const launcher = document.querySelector('[data-player-launcher]');
            if (!player || !launcher || !tracks.length) return;

            const audio = player.querySelector('[data-player-audio]');
            const cover = player.querySelector('[data-player-cover]');
            const title = player.querySelector('[data-player-title]');
            const artist = player.querySelector('[data-player-artist]');
            const playButton = player.querySelector('[data-player-play]');
            const progress = player.querySelector('[data-player-progress]');
            const current = player.querySelector('[data-player-current]');
            const duration = player.querySelector('[data-player-duration]');
            const timeline = player.querySelector('.music-player__timeline');
            const embed = player.querySelector('[data-player-embed]');
            const iframe = player.querySelector('[data-player-iframe]');
            const list = player.querySelector('[data-player-list]');
            const trackList = player.querySelector('[data-player-tracks]');
            let index = Number(localStorage.getItem('MengzhiMusicTrack') || 0) % tracks.length;
            let providerTimer = 0;
            let providerStartedAt = 0;

            const formatTime = (seconds) => {
                if (!Number.isFinite(seconds)) return '0:00';
                const minutes = Math.floor(seconds / 60);
                return `${minutes}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
            };

            const centerCurrentTrack = (behavior = 'smooth') => {
                if (list.hidden) return;
                window.requestAnimationFrame(() => {
                    const activeTrack = trackList.querySelector('.is-current');
                    if (!activeTrack) return;
                    const listRect = list.getBoundingClientRect();
                    const trackRect = activeTrack.getBoundingClientRect();
                    const top = list.scrollTop + trackRect.top - listRect.top
                        - (list.clientHeight - trackRect.height) / 2;
                    list.scrollTo({ top: Math.max(0, top), behavior });
                });
            };

            const renderList = () => {
                trackList.innerHTML = '';
                tracks.forEach((track, trackIndex) => {
                    const item = document.createElement('li');
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.dataset.index = String(trackIndex);
                    button.innerHTML = `<span>${track.title}</span><small>${track.artist}</small>`;
                    if (trackIndex === index) button.classList.add('is-current');
                    item.append(button);
                    trackList.append(item);
                });
            };

            const loadTrack = (nextIndex, shouldPlay = false) => {
                index = (nextIndex + tracks.length) % tracks.length;
                const track = tracks[index];
                stopProvider();
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                if (track.url) audio.src = track.url;
                cover.src = track.cover;
                title.textContent = track.title;
                artist.textContent = track.artist;
                artist.href = track.licenseUrl;
                progress.value = 0;
                current.textContent = '0:00';
                duration.textContent = formatTime(track.duration || 0);
                progress.disabled = false;
                progress.setAttribute('aria-disabled', String(!!track.bvid));
                localStorage.setItem('MengzhiMusicTrack', String(index));
                renderList();
                centerCurrentTrack();
                if (shouldPlay) playCurrent();
            };

            const updateProviderProgress = () => {
                const track = tracks[index];
                const total = Number(track.duration) || 0;
                const elapsed = Math.min((performance.now() - providerStartedAt) / 1000, total || Infinity);
                current.textContent = formatTime(elapsed);
                duration.textContent = formatTime(total);
                progress.value = total ? String((elapsed / total) * 100) : '0';
                if (total && elapsed >= total) loadTrack(index + 1, true);
            };

            const stopProvider = () => {
                window.clearInterval(providerTimer);
                providerTimer = 0;
                providerStartedAt = 0;
                iframe.src = '';
                embed.hidden = true;
                player.classList.remove('is-provider-playing');
                setPlayingState(false);
            };

            const playCurrent = () => {
                const track = tracks[index];
                if (track.bvid) {
                    const nextOpen = embed.hidden;
                    if (!nextOpen) {
                        stopProvider();
                        progress.value = 0;
                        current.textContent = '0:00';
                        return;
                    }
                    embed.hidden = false;
                    player.classList.add('is-provider-playing');
                    iframe.src = `https://player.bilibili.com/player.html?bvid=${encodeURIComponent(track.bvid)}&page=${encodeURIComponent(track.page || 1)}&high_quality=1&autoplay=1`;
                    providerStartedAt = performance.now();
                    updateProviderProgress();
                    providerTimer = window.setInterval(updateProviderProgress, 250);
                    setPlayingState(true);
                    return;
                }
                if (audio.paused) audio.play().catch(() => {});
                else audio.pause();
            };

            const setPlayingState = (playing) => {
                player.classList.toggle('is-playing', playing);
                playButton.setAttribute('aria-label', playing ? '暂停' : '播放');
                playButton.title = playing ? '暂停' : '播放';
            };

            playButton.addEventListener('click', () => {
                playCurrent();
            });
            player.querySelector('[data-player-prev]').addEventListener('click', () => loadTrack(index - 1, true));
            player.querySelector('[data-player-next]').addEventListener('click', () => loadTrack(index + 1, true));
            audio.addEventListener('play', () => setPlayingState(true));
            audio.addEventListener('pause', () => setPlayingState(false));
            audio.addEventListener('ended', () => loadTrack(index + 1, true));
            audio.addEventListener('loadedmetadata', () => { duration.textContent = formatTime(audio.duration); });
            audio.addEventListener('timeupdate', () => {
                current.textContent = formatTime(audio.currentTime);
                progress.value = audio.duration ? String((audio.currentTime / audio.duration) * 100) : '0';
            });
            progress.addEventListener('input', () => {
                if (tracks[index].bvid) return;
                if (audio.duration) audio.currentTime = (Number(progress.value) / 100) * audio.duration;
            });

            player.querySelector('[data-player-list-toggle]').addEventListener('click', () => {
                list.hidden = !list.hidden;
                player.classList.toggle('has-open-list', !list.hidden);
                centerCurrentTrack('auto');
            });
            trackList.addEventListener('click', (event) => {
                const button = event.target.closest('button[data-index]');
                if (button) loadTrack(Number(button.dataset.index), true);
            });
            player.querySelector('[data-player-collapse]').addEventListener('click', () => {
                stopProvider();
                player.hidden = true;
                launcher.hidden = false;
            });
            launcher.addEventListener('click', () => {
                launcher.hidden = true;
                player.hidden = false;
            });

            loadTrack(index);
        })();
    </script>
{{- end -}}
